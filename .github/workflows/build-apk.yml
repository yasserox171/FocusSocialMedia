name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [claude/project-build-3dewc9, main, master]
    paths: ["mobile/**", ".github/workflows/build-apk.yml"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build release APK
        run: |
          flutter pub get
          flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: focus-social-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk

      - name: Attach APK to a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-build-${{ github.run_number }}
          name: "فوكس سوشيال APK — build ${{ github.run_number }}"
          body: |
            نسخة أندرويد جاهزة للتثبيت. عنوان الخادم يُضبط من شاشة الدخول
            (إعدادات الخادم)، فنفس الملف يصلح لأي سيرفر.
          files: mobile/build/app/outputs/flutter-apk/app-release.apk
